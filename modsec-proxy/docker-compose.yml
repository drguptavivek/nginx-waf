version: "3.9"

services:
  proxy:
    build: ./nginx
    container_name: modsec-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_WORKER_PROCESSES=auto
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

      # ModSecurity + CRS (you own these)
      - ./modsec/main.conf:/etc/modsecurity/main.conf:ro
      - ./modsec/modsecurity.conf:/etc/modsecurity/modsecurity.conf:ro
      - ./modsec/audit.conf:/etc/modsecurity/audit.conf:ro
      - ./modsec/crs-setup.conf:/etc/modsecurity/crs-setup.conf:ro
      - ./modsec/rules:/etc/modsecurity/rules:ro
      - ./modsec/custom.d:/etc/modsecurity/custom.d:ro
      - ./modsec/vhosts:/etc/modsecurity/vhosts:ro

      # Persist audit
      - ./logs/modsec:/var/log/modsecurity

    restart: unless-stopped

  hot_ingest:
    image: python:3.11-slim
    container_name: modsec-hot-ingest
    working_dir: /app
    command: ["python","/app/log_ingest.py"]
    volumes:
      - ./hot:/app:ro
      - ./data/logs:/logs:ro
      - ./data/duckdb:/duckdb
    environment:
      - DUCKDB_PATH=/duckdb/modsec.duckdb
      - AUDIT_LOG=/logs/audit.json
      - TAIL_FROM_END=true
    restart: unless-stopped

  viewer:
    build: ./viewer
    container_name: modsec-viewer
    environment:
      - DUCKDB_PATH=/duckdb/modsec.duckdb
    volumes:
      - ./data/duckdb:/duckdb:ro
    ports:
      - "8080:8080"
    depends_on:
      - hot_ingest
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-12T00-00-00Z
    container_name: modsec-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000" # S3 API (bind to intranet only at host firewall)
      - "9001:9001" # Console (bind to intranet only at host firewall)
    restart: unless-stopped

  archiver:
    image: python:3.11-slim
    container_name: modsec-archiver
    working_dir: /app
    command: ["python","/app/archive_to_minio.py"]
    volumes:
      - ./archiver:/app:ro
      - ./data/duckdb:/duckdb:ro
    environment:
      - DUCKDB_PATH=/duckdb/modsec.duckdb
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=modsec-archive
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - ARCHIVE_EVERY_N_MINUTES=1440
    depends_on:
      - minio
      - hot_ingest
    restart: unless-stopped

volumes:
  # Using bind-mounts above to keep data on host
  # Define named volumes here if you prefer