# Allow internal subnet to bypass WAF (example)
SecRule REMOTE_ADDR "^10\.0\." \
  "id:100020,phase:1,pass,nolog,ctl:ruleEngine=Off"

# Block obvious scanners by UA (example)
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)sqlmap|nikto" \
  "id:100021,phase:1,deny,status:403,log,msg:'Blocked scanner UA'"
