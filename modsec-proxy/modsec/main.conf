# /ets/modsecurity/main.conf 
# common (engine, audit, CRS, org-wide tuning)# common (engine, audit, CRS, org-wide tuning)

# Base engine & audit (you supply these files)
Include /etc/modsecurity/modsecurity.conf
Include /etc/modsecurity/audit.conf

# CRS bootstrap + rules
Include /etc/modsecurity/crs-setup.conf
Include /etc/modsecurity/crs/rules/REQUEST-*.conf
Include /etc/modsecurity/crs/rules/RESPONSE-*.conf
Include /etc/modsecurity/rules/REQUEST-*.conf
Include /etc/modsecurity/rules/RESPONSE-*.conf

# Org-wide tuning (targeted, not global blinders)
Include /etc/modsecurity/rules/local-exclusions.conf
Include /etc/modsecurity/custom.d/*.conf

# Deployment-specific vhost rules should be mounted into /etc/modsecurity/rules.
# Do not include an empty wildcard here: ModSecurity treats it as an error.
