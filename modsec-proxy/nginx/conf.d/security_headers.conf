# nginx/conf.d/security_headers.conf
# Apply to all responses (including errors) via `always`.
# Tip: you can also include this per-server if you need exceptions.

# ---------------- Base hardening (safe to enable) ----------------
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Prefer CSP frame-ancestors over X-Frame-Options; keep XFO for legacy UAs.
add_header X-Frame-Options "DENY" always;
add_header X-Download-Options "noopen" always;         # IE/legacy
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Minimal Permissions-Policy (block powerful APIs by default).
# Loosen per need: e.g., geolocation=(self "https://maps.example")
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), wake-lock=(), xr-spatial-tracking=()" always;

# Cross-Origin Resource protections (good defaults for web apps)
add_header Cross-Origin-Opener-Policy "same-origin" always;          # isolation vs popup hijack
add_header Cross-Origin-Resource-Policy "same-origin" always;        # prevent other origins using your resources
# If you need SharedArrayBuffer or full cross-origin isolation:
# add_header Cross-Origin-Embedder-Policy "require-corp" always;     # enable only after testing

# ---------------- HSTS (enable only on HTTPS + after verifying subdomains) ----------------
# After you confirm every host answers on HTTPS, uncomment:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ---------------- Content Security Policy (start REPORT-ONLY) ----------------
# Begin with report-only to avoid breakage. Wire this to your CSP report endpoint.
# Replace example.com with your domain(s); add cdn/img/font endpoints as needed.
# Later, move the same policy to "Content-Security-Policy" (enforcement).
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests; report-uri /csp-report; report-to csp-endpoint" always;

# Optional: Reporting API group (Chrome/Edge). You can keep it even in enforcement mode.
add_header Report-To '{ "group": "csp-endpoint", "max_age": 10886400, "endpoints": [ { "url": "https://example.com/csp-report" } ] }' always;

# ---------------- MIME/type & caching for static (optional, adjust to your layout) ----------------
# Example: for /assets/ you may want tighter COEP + long cache. Put these in a location block instead:
# location ^~ /assets/ {
#   add_header Cross-Origin-Embedder-Policy "require-corp" always;
#   add_header Cache-Control "public, max-age=31536000, immutable" always;
# }

# ---------------- Legacy / deprecated headers (generally avoid) ----------------
# X-XSS-Protection is deprecated and can cause issues; do not enable:
# add_header X-XSS-Protection "1; mode=block" always;
# --- Security headers & server tokens ---
# Generic defaults for all responses
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header X-Download-Options "noopen" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Permissions-Policy: block most features by default
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), usb=()" always;

# Cross-Origin Protections
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Strict-Transport-Security (enable only on HTTPS!)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy (start in Report-Only mode)
add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; report-uri /csp-report" always;

# Mask server banner
proxy_hide_header X-Powered-By;
more_clear_headers Server;
