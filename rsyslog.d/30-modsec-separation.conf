module(load="imfile")

# NGINX error.log → only hard blocks (“Access denied”)
input(type="imfile" File="/absolute/path/to/logs/nginx/error.log"
      Tag="nginx-error:" addMetadata="on" ruleset="modsec_blocks")
ruleset(name="modsec_blocks") {
  if $msg contains "ModSecurity: Access denied" then {
    action(type="omfile" file="/absolute/path/to/logs/modsec/blocked.log")
  }
  stop
}

# ModSecurity audit JSON → full detections stream
input(type="imfile" File="/absolute/path/to/logs/modsec/audit.log"
      Tag="modsec-audit:" addMetadata="on" ruleset="modsec_detections")
ruleset(name="modsec_detections") {
  action(type="omfile" file="/absolute/path/to/logs/modsec/detections.log")
}
